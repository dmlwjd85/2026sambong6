    </radialGradient>
  </defs>
  <rect x="0.5" y="0.5" width="23" height="23" rx="5.5" fill="url(#rim)"/>
  <rect x="1.75" y="1.75" width="20.5" height="20.5" rx="4.25" fill="url(#enamel)"/>
  <rect x="10.2" y="4.4" width="3.6" height="12.2" rx="1.8" fill="var(--surface)" stroke="var(--gold)" stroke-width="2"/><circle cx="12" cy="16.6" r="2.3" fill="var(--wine)"/>
