<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="MATE는 학급 메타버스입니다. 퀘스트, 광장, 상점, 수업 도구로 우리 반 모험을 합니다.">
    <title>MATE</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MATE">
    <link rel="icon" href="olympus/pediment.svg">
    <link rel="preload" href="fonts/Cinzel-Bold.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/Pretendard-Medium.woff2" as="font" type="font/woff2" crossorigin>
    <script>
        try {
            if (localStorage.getItem('sambong_student_id') && localStorage.getItem('sambong_student_pin')) {
                document.documentElement.classList.add('boot-resume');
            }
        } catch (e) {}
        const iconUrl = new URL('olympus/pediment.svg', window.location.href).href;
        const manifest = {
            name: 'MATE', short_name: 'MATE', start_url: window.location.pathname,
            display: 'standalone',
            icons: [{ src: iconUrl, sizes: 'any', type: 'image/svg+xml', purpose: 'any' }]
        };
        const manifestLink = document.createElement('link');
        manifestLink.rel = 'manifest';
        manifestLink.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/json' }));
        document.head.appendChild(manifestLink);
    </script>
    <style>
        @font-face {
            font-family: Pretendard;
            font-style: normal;
            font-weight: 400;
            font-display: swap;
            src: url("fonts/Pretendard-Medium.woff2") format("woff2");
        }
        @font-face {
            font-family: Pretendard;
            font-style: normal;
            font-weight: 500;
            font-display: swap;
            src: url("fonts/Pretendard-Medium.woff2") format("woff2");
        }
        @font-face {
            font-family: Pretendard;
            font-style: normal;
            font-weight: 700;
            font-display: swap;
            src: url("fonts/Pretendard-Bold.woff2") format("woff2");
        }
        @font-face {
            font-family: Cinzel;
            font-style: normal;
            font-weight: 700;
            font-display: swap;
            src: url("fonts/Cinzel-Bold.woff2") format("woff2");
        }
        :root {
            --bg: #F3F8FD;
            --surface: #FFFFFF;
            --sky-deep: #1C64A8;
            --gold: #D4A63A;
            --gold-light: #F4D77E;
            --gold-text: #6B4F0E;
            --ink: #1E2A40;
            --ink-2: #45526C;
            --line: #E3E8F0;
            --navy: #1B2A4A;
            --secondary-bg: #E7F3FC;
            --reward-bg: linear-gradient(180deg, #F4D77E, #E8C56A);
            --shadow-card: 0 4px 12px rgba(36, 50, 74, 0.08);
            --shadow-press: 0 4px 0 #0E3F6E;
            --type-scale: 1;
            --font-body: Pretendard, sans-serif;
            --font-logo: Cinzel, Pretendard, serif;
        }
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            max-width: 100%;
            overflow-x: hidden;
            background: var(--bg);
            color: var(--ink);
            font-family: var(--font-body);
            font-size: calc(16px * var(--type-scale));
            line-height: 1.5;
        }
        button, input, select { font: inherit; }
        .hidden, [hidden] { display: none !important; }
        #loginOverlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));
            background: var(--bg);
            overflow-x: hidden;
            overflow-y: auto;
        }
        #loginWorldTitle {
            margin: 0;
            color: var(--navy);
            font-family: var(--font-logo);
            font-size: calc(48px * var(--type-scale));
            font-weight: 700;
            line-height: 1.5;
            letter-spacing: 0.08em;
            text-align: center;
        }
        .login-kicker, .login-version, #loginRoleHint, .login-note, #loginClassLabel, #loginRemembered {
            margin: 0;
            color: var(--ink-2);
            font-size: calc(14px * var(--type-scale));
            text-align: center;
        }
        .login-version {
            position: fixed;
            right: 12px;
            bottom: calc(12px + env(safe-area-inset-bottom));
            z-index: 80;
            font-size: calc(12px * var(--type-scale));
            font-weight: 700;
            pointer-events: none;
        }
        h2 {
            margin: 0 0 12px;
            color: var(--navy);
            font-size: calc(24px * var(--type-scale));
            text-align: center;
        }
        .login-card {
            width: min(100%, 28rem);
            max-height: min(92vh, 920px);
            overflow-x: hidden;
            overflow-y: auto;
            margin-top: 16px;
            padding: 20px;
            background: var(--surface);
            color: var(--ink);
            border: 2px solid var(--gold-text);
            border-radius: 20px;
            box-shadow: var(--shadow-card);
        }
        .login-modes, .login-split { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .login-field { display: block; margin-top: 12px; color: var(--ink); font-size: calc(14px * var(--type-scale)); font-weight: 700; }
        .login-row { display: flex; gap: 8px; margin-top: 8px; }
        .login-row input { flex: 1; min-width: 0; }
        .login-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        input, select {
            width: 100%;
            min-height: 48px;
            margin-top: 4px;
            padding: 8px 12px;
            color: var(--ink);
            background: var(--surface);
            border: 2px solid var(--navy);
            border-radius: 14px;
            font-size: calc(16px * var(--type-scale));
        }
        .oly-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            min-width: 48px;
            padding: 8px 16px;
            border-radius: 14px;
            border: 2px solid transparent;
            font-size: calc(16px * var(--type-scale));
            font-weight: 700;
            cursor: pointer;
        }
        .oly-btn-primary { background: var(--sky-deep); color: var(--surface); }
        .oly-btn-secondary { background: var(--secondary-bg); color: var(--ink); border-color: var(--navy); }
        .oly-btn-reward { background: var(--reward-bg); color: var(--ink); border-color: var(--gold-text); }
        .login-go { width: 100%; margin-top: 12px; box-shadow: var(--shadow-press); }
        .login-links { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
        #bootSkeleton {
            display: none;
            width: min(100%, 28rem);
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }
        html.boot-resume #bootSkeleton { display: flex; }
        html.boot-resume #loginStack { display: none; }
        .sk-bar {
            width: 100%;
            height: 48px;
            border-radius: 14px;
            background: var(--line);
        }
        .sk-title {
            width: 8rem;
            margin: 0;
            color: var(--navy);
            font-family: var(--font-logo);
            font-size: calc(48px * var(--type-scale));
            font-weight: 700;
            line-height: 1.5;
            text-align: center;
        }
        #appMount { display: none; }
        body.oly-app #appMount { display: block; }
        :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
    </style>
</head>
<body>
    <p class="login-version" data-app-version>v1.47</p>
    <input type="file" id="quizBankExcelInput" accept=".xlsx,.xls,.csv" class="hidden" tabindex="-1" aria-hidden="true" onchange="window.onQuizBankExcelPicked && window.onQuizBankExcelPicked(event)">
    <div id="offlineBanner" class="hidden" role="status">
        연결이 불안정합니다. 자동으로 다시 시도합니다.
        <button type="button" class="oly-btn oly-btn-secondary" onclick="void window.retryPendingNetworkActions && window.retryPendingNetworkActions()">지금 다시 시도</button>
    </div>
    <div id="globalLoadingOverlay" class="hidden" aria-live="polite" aria-busy="true">
        <p id="globalLoadingText">잠시만 기다려 주세요…</p>
        <p id="globalLoadingError" class="hidden"></p>
        <button type="button" id="globalLoadingRetryBtn" class="oly-btn oly-btn-primary hidden" onclick="void window.retryPendingNetworkActions && window.retryPendingNetworkActions(); window.hideGlobalLoading && window.hideGlobalLoading();">다시 시도</button>
    </div>

    <div id="loginOverlay">
        <div id="bootSkeleton" aria-live="polite">
            <p class="sk-title">MATE</p>
            <p class="login-kicker">기억한 계정으로 들어가는 중</p>
            <div class="sk-bar"></div>
            <div class="sk-bar"></div>
            <button type="button" id="btnSwitchUserBoot" class="oly-btn oly-btn-secondary">다른 사람으로 로그인</button>
        </div>
        <div id="loginStack">
            <h1 id="loginWorldTitle">MATE</h1>
            <p id="loginSeasonSubtitle" class="login-kicker">[시즌 1 : 우리 반 모험]</p>
            <div class="login-card">
                <h2>어떻게 들어갈까요?</h2>
                <div class="login-modes">
                    <button type="button" id="loginModeStudentBtn" class="oly-btn oly-btn-primary">학생</button>
                    <button type="button" id="loginModeTeacherBtn" class="oly-btn oly-btn-secondary">선생님</button>
                </div>
                <p id="loginRoleHint">이름이 기억되어 있으면 비밀번호만 누르면 됩니다.</p>
                <p id="loginRemembered" class="login-note" hidden></p>

                <div id="loginPanelStudent">
                    <label class="login-field" for="loginClassCode">초대 코드
                        <span class="login-row">
                            <input type="text" id="loginClassCode" name="organization" placeholder="예: A3K9MP" autocomplete="off" enterkeyhint="next">
                            <button type="button" id="btnApplyClass" data-login-bridge="1" class="oly-btn oly-btn-primary">열기</button>
                        </span>
                    </label>
                    <p id="loginClassLabel" class="login-note">초대 코드를 넣으면 학급 이름이 나타납니다.</p>
                    <div id="loginRecentClasses" class="hidden" hidden></div>
                    <label class="login-field" for="loginId">내 이름
                        <select id="loginId" name="username" autocomplete="username">
                            <option value="" disabled selected>내 이름 선택</option>
                        </select>
                    </label>
                    <label class="login-field" for="loginPin">비밀번호 4자리
                        <input type="password" id="loginPin" name="password" placeholder="••••" maxlength="4" pattern="[0-9]*" inputmode="numeric" autocomplete="current-password" enterkeyhint="go">
                    </label>
                    <p class="login-note">처음 넣은 번호가 내 비밀번호가 됩니다.</p>
                    <button type="button" id="btnLogin" data-login-bridge="1" class="oly-btn oly-btn-primary login-go">들어가기</button>
                </div>

                <div id="loginPanelTeacher" class="hidden">
                    <div class="login-split">
                        <button type="button" id="teacherSubJoinBtn" class="oly-btn oly-btn-reward">우리 학급</button>
                        <button type="button" id="teacherSubCreateBtn" class="oly-btn oly-btn-secondary">새 학급</button>
                    </div>
                    <div id="teacherJoinPanel">
                        <label class="login-field" for="teacherJoinCode">초대 코드
                            <span class="login-row">
                                <input type="text" id="teacherJoinCode" placeholder="예: A3K9MP" autocomplete="off" enterkeyhint="next">
                                <button type="button" id="btnTeacherJoin" class="oly-btn oly-btn-reward">열기</button>
                            </span>
                        </label>
                        <p id="teacherJoinClassHint" class="login-note">학급을 열면 여기에 이름이 나타납니다.</p>
                        <label class="login-field" for="loginIdTeacher">마스터 계정
                            <select id="loginIdTeacher" name="username" autocomplete="username">
                                <option value="" disabled selected>계정 선택</option>
                            </select>
                        </label>
                        <label class="login-field" for="loginPinTeacher">마스터 PIN
                            <input type="password" id="loginPinTeacher" name="password" placeholder="••••" maxlength="4" pattern="[0-9]*" inputmode="numeric" autocomplete="current-password" enterkeyhint="go">
                        </label>
                        <button type="button" id="btnLoginTeacher" data-login-bridge="1" class="oly-btn oly-btn-reward login-go">선생님으로 들어가기</button>
                    </div>
                    <div id="teacherCreatePanel" class="hidden">
                        <p id="teacherCreateIntro" class="login-note">새 학급은 개설 코드가 있을 때만 요청할 수 있습니다.</p>
                        <div id="classCreateRequestBox" class="hidden"></div>
                        <div id="teacherCreateUnlockGate">
                            <p class="login-note">받은 학급 개설 코드 6자리를 넣으세요.</p>
                            <div class="login-row">
                                <input id="teacherCreateUnlockInput" type="text" maxlength="8" placeholder="개설 코드" autocomplete="off">
                                <button type="button" id="btnTeacherUnlock" class="oly-btn oly-btn-primary">확인</button>
                            </div>
                            <p id="teacherCreateUnlockError" class="hidden"></p>
                        </div>
                        <div id="teacherCreateFormFields" class="hidden">
                            <label class="login-field" for="createClassDisplayName">학급 이름
                                <input id="createClassDisplayName" type="text" maxlength="40" placeholder="예: 6학년 2반" autocomplete="organization">
                            </label>
                            <div class="login-grid-3">
                                <label class="login-field">학년도
                                    <input id="createClassYear" type="number" min="2020" max="2100" value="2026">
                                </label>
                                <label class="login-field">학년
                                    <input id="createClassGrade" type="number" min="1" max="6" value="6">
                                </label>
                                <label class="login-field">반
                                    <input id="createClassHomeroom" type="number" min="1" max="20" value="1">
                                </label>
                            </div>
                            <label class="login-field" for="createClassTeacherPin">마스터 PIN 4자리
                                <input id="createClassTeacherPin" type="password" maxlength="4" pattern="[0-9]*" inputmode="numeric" placeholder="••••" autocomplete="new-password">
                            </label>
                            <details>
                                <summary>선택 항목</summary>
                                <label class="login-field">학교명
                                    <input id="createClassSchoolName" type="text" maxlength="40" placeholder="예: ○○초등학교" autocomplete="organization">
                                </label>
                                <label class="login-field">마스터 표시 이름
                                    <input id="createClassTeacherName" type="text" maxlength="20" placeholder="예: 김○○ 선생님" value="담임 선생님" autocomplete="name">
                                </label>
                                <label class="login-field">시즌명
                                    <input id="createClassSeasonName" type="text" maxlength="30" value="시즌 1">
                                </label>
                                <label class="login-field">시즌 테마
                                    <input id="createClassSeasonTheme" type="text" maxlength="60" value="우리 반 모험">
                                </label>
                                <label class="login-field">학생 수
                                    <input id="createClassStudentCount" type="number" min="1" max="40" value="24">
                                </label>
                                <label class="login-field">
                                    <input id="createClassApplyTemplate" type="checkbox"> 기본 템플릿 적용 (퀘스트·직업)
                                </label>
                            </details>
                            <button type="button" id="btnCreateClass" class="oly-btn oly-btn-primary login-go">학급 개설 요청하기</button>
                        </div>
                    </div>
                </div>
                <div class="login-links">
                    <button type="button" id="btnSwitchUserLogin" class="oly-btn oly-btn-secondary">다른 사람으로 로그인</button>
                    <button type="button" id="btnGuest" class="oly-btn oly-btn-secondary">구경만 하기</button>
                    <button type="button" id="btnLoginHelp" class="oly-btn oly-btn-secondary">도움말</button>
                </div>
            </div>
        </div>
    </div>
    <div id="appMount"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
