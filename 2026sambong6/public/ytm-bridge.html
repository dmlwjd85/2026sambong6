<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>유튜브 뮤직으로 이동</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f172a;
            color: #f9a8d4;
            font-family: "Noto Sans KR", system-ui, sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            text-align: center;
            padding: 1.5rem;
        }
    </style>
</head>
<body>
    <div id="msg">🎵 준비 중...</div>
    <script>
        (function () {
            var params = new URLSearchParams(location.search);
            var wait = params.get('wait') === '1';
            var u = params.get('u') || params.get('url') || '';
            var msg = document.getElementById('msg');

            if (wait && !u) {
                msg.textContent = '🎵 곡을 찾는 중...';
                return;
            }
            if (!u) {
                msg.textContent = '이동할 주소가 없습니다.';
                return;
            }

            try {
                var parsed = new URL(u);
                var host = parsed.hostname;
                var allowed =
                    host === 'music.youtube.com' ||
                    host === 'www.youtube.com' ||
                    host === 'youtube.com' ||
                    host === 'm.youtube.com';
                if (!allowed) {
                    msg.textContent = '허용되지 않은 주소입니다.';
                    return;
                }
                msg.textContent = '🎵 유튜브 뮤직으로 이동 중...';
                location.replace(u);
            } catch (e) {
                msg.textContent = '주소 오류로 이동할 수 없습니다.';
            }
        })();
    </script>
</body>
</html>
