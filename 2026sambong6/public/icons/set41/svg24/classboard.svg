    </radialGradient>
  </defs>
  <rect x="0.5" y="0.5" width="23" height="23" rx="5.5" fill="url(#rim)"/>
  <rect x="1.75" y="1.75" width="20.5" height="20.5" rx="4.25" fill="url(#enamel)"/>
  <rect x="4.4" y="5.2" width="15.2" height="12.4" rx="1.2" fill="var(--marble)" stroke="var(--gold)" stroke-width="2.2"/><rect x="7" y="8" width="4.2" height="3.2" fill="var(--gold-light)"/>
